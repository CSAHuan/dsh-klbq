name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: 语法检查
        run: |
          node --check lib/index.js
          node --check lib/dakanu.js
          node --check lib/render.js

      - name: 插件契约冒烟测试（不联网）
        shell: node {0}
        run: |
          // 用假 ctx 验证插件能导出 name/inject/apply，且工具定义形状正确。
          // 不触网、不渲染，纯静态契约检查，所以可以在 CI 里稳定跑。
          //
          // 注意：shell: node {0} 会把这段脚本落到临时目录再执行，
          // 所以 `import('./lib/index.js')` 会相对临时目录解析而报 MODULE_NOT_FOUND，
          // 必须用 process.cwd()（= 工作区根）拼绝对路径再转成 file URL。
          const path = await import('node:path');
          const { pathToFileURL } = await import('node:url');
          const entry = pathToFileURL(path.resolve(process.cwd(), 'lib/index.js')).href;
          const mod = await import(entry);
          const assert = (cond, msg) => { if (!cond) { console.error('FAIL: ' + msg); process.exit(1); } };
          assert(typeof mod.name === 'string' && mod.name.length > 0, 'name 缺失');
          assert(Array.isArray(mod.inject) && mod.inject.includes('tools'), 'inject 应包含 tools');
          assert(typeof mod.apply === 'function', 'apply 不是函数');
          assert(typeof mod.queryPlayer === 'function', 'queryPlayer 未导出');

          const registered = [];
          const ctx = {
            tools: { register(def) { registered.push(def); return () => {}; } },
            effect(fn) { fn(); },
            on() { return () => {}; },
            logger: { info() {}, warn() {} },
          };
          mod.apply(ctx);
          const def = registered[0];
          assert(def && def.name === 'klbq_query', '未注册 klbq_query');
          assert(def.parameters.required.includes('nickname'), 'nickname 应为必填');
          assert(def.parameters.additionalProperties === false, '应禁止额外参数');
          assert(typeof def.resolve === 'function', 'resolve 不是函数');

          // ── QQ 机器人适配层（CI 没装 dsh-qqbot，直接测桥本身） ──
          const qqEntry = pathToFileURL(path.resolve(process.cwd(), 'lib/qqbot.js')).href;
          const qq = await import(qqEntry);
          assert(typeof qq.detectQQBot === 'function', 'detectQQBot 未导出');
          assert(typeof qq.installQQBotBridge === 'function', 'installQQBotBridge 未导出');
          assert(typeof qq.QQBOT_PROMPT === 'string' && qq.QQBOT_PROMPT.includes('/klbq'), '注入文案应说明 /klbq');
          assert(typeof qq.SECTION_NAME === 'string' && qq.SECTION_NAME.length > 0, 'SECTION_NAME 未导出');

          const handlers = new Map();
          const fakeCtx = {
            on(evt, fn) { handlers.set(evt, fn); return () => handlers.delete(evt); },
            effect() {},
            logger: { info() {}, warn() {} },
          };
          assert(qq.installQQBotBridge(fakeCtx, {}) === true, '桥挂载应返回 true');
          const h = handlers.get('system-prompt/assemble');
          assert(typeof h === 'function', '应监听 system-prompt/assemble');

          const next = async () => ({ sections: [{ name: 'base', order: 1, text: 'x' }] });
          let r = await h({}, {}, next);
          assert(r.sections.length === 1, '没有 agent 的回合不应注入');
          r = await h({}, { agent: { id: 'a' } }, next);
          assert(r.sections.length === 2, '有 agent 的回合应注入一段');
          assert(r.sections[1].name === qq.SECTION_NAME, '注入段落名不对');
          const again = await h({}, { agent: { id: 'a' } }, async () => r);
          assert(again.sections.length === 2, '同名段落不应重复叠加');
          const empty = await h({}, { agent: { id: 'a' } }, async () => ({}));
          assert(Array.isArray(empty.sections) && empty.sections.length === 1, '空组装应新建 sections');

          console.log('OK');